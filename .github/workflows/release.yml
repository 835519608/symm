# 正式发布：仅匹配无连字符的 semver tag（如 v0.2.0），勿用 -test / -rc 等后缀。
# 打包前不重复跑测试：校验当前 commit 上 ci.yml 已成功。
name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: 校验 CI 已通过
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/verify-ci-passed

  prepare-release:
    name: 准备 Release 说明
    needs: verify-ci
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ github.ref_name }}
      release_semver: ${{ steps.version.outputs.semver }}
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        uses: ./.github/actions/resolve-release-version
      - id: notes
        uses: ./.github/actions/prepare-release-notes

  build-windows-x64:
    name: 构建产物 (windows-x64)
    needs: prepare-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-2025-vs2026
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: Windows 安装包与便携包
        uses: ./.github/actions/package-windows
        with:
          release_semver: ${{ needs.prepare-release.outputs.release_semver }}

      - name: 上传临时产物
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows-x64
          path: |
            symm-setup-windows-x64.exe
            symm-portable-windows-x64.zip
          if-no-files-found: error

  build-windows-arm64:
    name: 构建产物 (windows-arm64)
    needs: prepare-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-11-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: Windows 便携包
        uses: ./.github/actions/package-windows
        with:
          release_semver: ${{ needs.prepare-release.outputs.release_semver }}
          portable_name: symm-portable-windows-arm64.zip
          build_installer: "false"

      - name: 上传临时产物
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows-arm64
          path: symm-portable-windows-arm64.zip
          if-no-files-found: error

  build-windows-x86:
    name: 构建产物 (windows-x86)
    needs: prepare-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-2025-vs2026
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: Windows 便携包
        uses: ./.github/actions/package-windows
        with:
          release_semver: ${{ needs.prepare-release.outputs.release_semver }}
          build_target: i686-pc-windows-msvc
          portable_name: symm-portable-windows-x86.zip
          build_installer: "false"

      - name: 上传临时产物
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows-x86
          path: symm-portable-windows-x86.zip
          if-no-files-found: error

  build-linux:
    name: 构建产物 (linux-${{ matrix.arch }})
    needs: prepare-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            archive_name: symm-portable-linux-x64.zip
          - arch: arm64
            runner: ubuntu-24.04-arm
            archive_name: symm-portable-linux-arm64.zip
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: 打包便携 zip
        uses: ./.github/actions/package-portable
        with:
          archive_name: ${{ matrix.archive_name }}
          release_semver: ${{ needs.prepare-release.outputs.release_semver }}

      - name: 上传临时产物
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-linux-${{ matrix.arch }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  build-macos:
    name: 构建产物 (macos-${{ matrix.arch }})
    needs: prepare-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            archive_name: symm-portable-macos-x64.zip
          - arch: arm64
            runner: macos-15
            archive_name: symm-portable-macos-arm64.zip
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: 打包便携 zip
        uses: ./.github/actions/package-portable
        with:
          archive_name: ${{ matrix.archive_name }}
          release_semver: ${{ needs.prepare-release.outputs.release_semver }}

      - name: 上传临时产物
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-macos-${{ matrix.arch }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  publish-release:
    name: 发布 Release
    needs:
      - prepare-release
      - build-windows-x64
      - build-windows-arm64
      - build-windows-x86
      - build-linux
      - build-macos
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部临时产物
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if ! find . -maxdepth 1 -type f ! -name SHA256SUMS -print -quit | grep -q .; then
            echo "::error::没有找到可发布产物"
            exit 1
          fi
          : > SHA256SUMS
          while IFS= read -r -d '' file; do
            sha256sum "${file#./}" >> SHA256SUMS
          done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z)
          cat SHA256SUMS

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ needs.prepare-release.outputs.release_body }}
          files: dist/*
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
