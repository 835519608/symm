# 正式发布：触发 v* 且排除带连字符 tag；semver 合法性由 resolve-release-version 校验。
# 打包前不重复跑测试：校验当前 commit 上必需的检查已成功。
name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify-ci:
    name: 校验 CI 已通过
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-ci-passed
      - name: 校验当前 commit 的 Workflow Lint 已通过
        uses: ./.github/actions/verify-ci-passed
        with:
          workflow_file: workflow-lint.yml

  prepare-release:
    name: 准备 Release 说明
    needs: verify-ci
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ github.ref_name }}
      release_semver: ${{ steps.version.outputs.semver }}
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        uses: ./.github/actions/resolve-release-version
      - id: notes
        uses: ./.github/actions/prepare-release-notes

  build_assets:
    name: 构建平台产物
    needs: prepare-release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/build-release-assets.yml
    with:
      release_semver: ${{ needs.prepare-release.outputs.release_semver }}
      artifact_prefix: release-assets
      build_windows_x64: true
      build_windows_arm64: true
      build_windows_x86: true
      build_linux_x64: true
      build_linux_arm64: true
      build_macos_x64: true
      build_macos_arm64: true

  publish-release:
    name: 发布 Release
    needs:
      - prepare-release
      - build_assets
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载全部临时产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/download-release-artifacts.sh 'release-assets-*' dist

      - name: 校验待发布产物
        uses: ./.github/actions/validate-release-assets
        with:
          expected_assets: |
            symm-setup-windows-x64.exe
            symm-portable-windows-x64.zip
            symm-portable-windows-arm64.zip
            symm-portable-windows-x86.zip
            symm-portable-linux-x64.zip
            symm-portable-linux-arm64.zip
            symm-portable-macos-x64.zip
            symm-portable-macos-arm64.zip

      - name: 生成 SHA256SUMS
        uses: ./.github/actions/generate-sha256sums

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.prepare-release.outputs.release_body }}
          files: dist/*
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true

      - name: 校验已发布 Release
        uses: ./.github/actions/validate-release-assets
        with:
          expected_assets: |
            symm-setup-windows-x64.exe
            symm-portable-windows-x64.zip
            symm-portable-windows-arm64.zip
            symm-portable-windows-x86.zip
            symm-portable-linux-x64.zip
            symm-portable-linux-arm64.zip
            symm-portable-macos-x64.zip
            symm-portable-macos-arm64.zip
            SHA256SUMS
          release_tag: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: "false"
