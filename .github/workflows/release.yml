# 正式发布：触发 v* 且排除带连字符 tag；semver 合法性由 resolve-release-version 校验。
# 打包前不重复跑测试：校验当前 commit 上必需的检查已成功。
name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: 校验 CI 已通过
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/verify-ci-passed
      - id: workflow_lint_scope
        name: 判断是否需要 workflow lint
        shell: bash
        run: |
          if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^\.github/(workflows|actions)/' >/dev/null; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 校验当前 commit 的 Workflow Lint 已通过
        if: steps.workflow_lint_scope.outputs.required == 'true'
        uses: ./.github/actions/verify-ci-passed
        with:
          workflow_file: workflow-lint.yml

  prepare-release:
    name: 准备 Release 说明
    needs: verify-ci
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ github.ref_name }}
      release_semver: ${{ steps.version.outputs.semver }}
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        uses: ./.github/actions/resolve-release-version
      - id: notes
        uses: ./.github/actions/prepare-release-notes

  build_assets:
    name: 构建平台产物
    needs: prepare-release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/build-release-assets.yml
    with:
      release_semver: ${{ needs.prepare-release.outputs.release_semver }}
      artifact_prefix: release-assets
      build_windows_x64: true
      build_windows_arm64: true
      build_windows_x86: true
      build_linux_x64: true
      build_linux_arm64: true
      build_macos_x64: true
      build_macos_arm64: true

  publish-release:
    name: 发布 Release
    needs:
      - prepare-release
      - build_assets
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部临时产物
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if ! find . -maxdepth 1 -type f ! -name SHA256SUMS -print -quit | grep -q .; then
            echo "::error::没有找到可发布产物"
            exit 1
          fi
          : > SHA256SUMS
          while IFS= read -r -d '' file; do
            sha256sum "${file#./}" >> SHA256SUMS
          done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z)
          cat SHA256SUMS

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ needs.prepare-release.outputs.release_body }}
          files: dist/*
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
