name: Workflow Lint

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 检查 workflow 和 action
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: 校验测试包计划脚本
        run: .github/scripts/plan-test-release.sh --self-test
