name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "packaging/**"
      - "symm-manifest.rc"
      - "symm.manifest"
      - "assets/**"
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "packaging/**"
      - "symm-manifest.rc"
      - "symm.manifest"
      - "assets/**"
      - ".github/workflows/**"
      - ".github/actions/**"

jobs:
  test:
    name: 测试 (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            target: ""
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: ""
          - name: windows-x64
            runner: windows-2025-vs2026
            target: ""
          - name: windows-arm64
            runner: windows-11-arm
            target: ""
          - name: windows-x86
            runner: windows-2025-vs2026
            target: i686-pc-windows-msvc
          - name: macos-x64
            runner: macos-15-intel
            target: ""
          - name: macos-arm64
            runner: macos-15
            target: ""
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 Rust target
        if: ${{ matrix.target != '' }}
        run: rustup target add ${{ matrix.target }}

      - name: 下载 GUI 内嵌字体
        uses: ./.github/actions/fetch-gui-font

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy 检查
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          args=(clippy --all-targets --all-features)
          if [ -n "${BUILD_TARGET}" ]; then
            args+=(--target "${BUILD_TARGET}")
          fi
          args+=(-- -D warnings)
          cargo "${args[@]}"

      - name: 全量测试
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          args=(test --all-targets)
          if [ -n "${BUILD_TARGET}" ]; then
            args+=(--target "${BUILD_TARGET}")
          fi
          cargo "${args[@]}"

      - name: GUI 单元测试
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          args=(test --features gui --lib)
          if [ -n "${BUILD_TARGET}" ]; then
            args+=(--target "${BUILD_TARGET}")
          fi
          cargo "${args[@]}"
