name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/**"
      - "packaging/**"
      - "symm-manifest.rc"
      - "symm.manifest"
      - "assets/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/**"
      - "packaging/**"
      - "symm-manifest.rc"
      - "symm.manifest"
      - "assets/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"

jobs:
  test:
    name: 测试 (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            target: ""
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: ""
          - name: windows-x64
            runner: windows-2025-vs2026
            target: ""
          - name: windows-arm64
            runner: windows-11-arm
            target: ""
          - name: windows-x86
            runner: windows-2025-vs2026
            target: i686-pc-windows-msvc
          - name: macos-x64
            runner: macos-15-intel
            target: ""
          - name: macos-arm64
            runner: macos-15
            target: ""
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Rust target
        if: ${{ matrix.target != '' }}
        run: rustup target add ${{ matrix.target }}

      - name: 下载 GUI 内嵌字体
        uses: ./.github/actions/fetch-gui-font

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy 检查
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          args=(clippy --locked --all-targets --all-features)
          if [ -n "${BUILD_TARGET}" ]; then
            args+=(--target "${BUILD_TARGET}")
          fi
          args+=(-- -D warnings)
          cargo "${args[@]}"

      - name: 全量测试
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          args=(test --locked --all-targets)
          if [ -n "${BUILD_TARGET}" ]; then
            args+=(--target "${BUILD_TARGET}")
          fi
          cargo "${args[@]}"

      - name: GUI 单元测试
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          args=(test --locked --features gui --lib)
          if [ -n "${BUILD_TARGET}" ]; then
            args+=(--target "${BUILD_TARGET}")
          fi
          cargo "${args[@]}"

  package-smoke:
    name: 打包烟测 (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-portable
            runner: ubuntu-24.04
            package_action: portable
            archive_name: symm-portable-linux-x64-smoke.zip
          - name: linux-arm64-portable
            runner: ubuntu-24.04-arm
            package_action: portable
            archive_name: symm-portable-linux-arm64-smoke.zip
          - name: macos-x64-portable
            runner: macos-15-intel
            package_action: portable
            archive_name: symm-portable-macos-x64-smoke.zip
          - name: macos-arm64-portable
            runner: macos-15
            package_action: portable
            archive_name: symm-portable-macos-arm64-smoke.zip
          - name: windows-x64-installer
            runner: windows-2025-vs2026
            package_action: windows
            portable_name: symm-portable-windows-x64-smoke.zip
            installer_name: symm-setup-windows-x64-smoke.exe
            build_target: ""
            build_installer: "true"
          - name: windows-arm64-portable
            runner: windows-11-arm
            package_action: windows
            portable_name: symm-portable-windows-arm64-smoke.zip
            installer_name: ""
            build_target: ""
            build_installer: "false"
          - name: windows-x86-portable
            runner: windows-2025-vs2026
            package_action: windows
            portable_name: symm-portable-windows-x86-smoke.zip
            installer_name: ""
            build_target: i686-pc-windows-msvc
            build_installer: "false"
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux 便携包烟测
        if: ${{ matrix.package_action == 'portable' }}
        uses: ./.github/actions/package-portable
        with:
          archive_name: ${{ matrix.archive_name }}
          release_semver: 0.0.0

      - name: Windows 安装包烟测
        if: ${{ matrix.package_action == 'windows' }}
        uses: ./.github/actions/package-windows
        with:
          release_semver: 0.0.0
          build_target: ${{ matrix.build_target }}
          portable_name: ${{ matrix.portable_name }}
          installer_name: ${{ matrix.installer_name }}
          build_installer: ${{ matrix.build_installer }}
