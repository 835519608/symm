# 统一构建发布产物：正式发布和测试发布共用同一套平台清单，调用方只决定构建哪些目标包。
name: Build Release Assets

on:
  workflow_call:
    inputs:
      release_semver:
        description: 写入 Cargo / 安装包显示用的 X.Y.Z
        required: true
        type: string
      artifact_prefix:
        description: 上传临时 artifact 的名称前缀
        required: true
        type: string
      build_windows_x64:
        description: 构建 Windows x64 包（含 installer）
        required: true
        type: boolean
      build_windows_arm64:
        description: 构建 Windows arm64 包
        required: true
        type: boolean
      build_windows_x86:
        description: 构建 Windows x86 包
        required: true
        type: boolean
      build_linux_x64:
        description: 构建 Linux x64 包
        required: true
        type: boolean
      build_linux_arm64:
        description: 构建 Linux arm64 包
        required: true
        type: boolean
      build_macos_x64:
        description: 构建 macOS x64 包
        required: true
        type: boolean
      build_macos_arm64:
        description: 构建 macOS arm64 包
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: 构建产物 (windows-x64)
    if: ${{ inputs.build_windows_x64 }}
    runs-on: windows-2025-vs2026
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: Windows 安装包与便携包
        uses: ./.github/actions/package-windows
        with:
          release_semver: ${{ inputs.release_semver }}

      - name: 上传临时产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-windows-x64
          path: |
            symm-setup-windows-x64.exe
            symm-portable-windows-x64.zip
          if-no-files-found: error

  build-windows-arm64:
    name: 构建产物 (windows-arm64)
    if: ${{ inputs.build_windows_arm64 }}
    runs-on: windows-11-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: Windows 便携包
        uses: ./.github/actions/package-windows
        with:
          release_semver: ${{ inputs.release_semver }}
          portable_name: symm-portable-windows-arm64.zip
          build_installer: "false"

      - name: 上传临时产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-windows-arm64
          path: symm-portable-windows-arm64.zip
          if-no-files-found: error

  build-windows-x86:
    name: 构建产物 (windows-x86)
    if: ${{ inputs.build_windows_x86 }}
    runs-on: windows-2025-vs2026
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: Windows 便携包
        uses: ./.github/actions/package-windows
        with:
          release_semver: ${{ inputs.release_semver }}
          build_target: i686-pc-windows-msvc
          portable_name: symm-portable-windows-x86.zip
          build_installer: "false"

      - name: 上传临时产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-windows-x86
          path: symm-portable-windows-x86.zip
          if-no-files-found: error

  build-linux-x64:
    name: 构建产物 (linux-x64)
    if: ${{ inputs.build_linux_x64 }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: 打包便携 zip
        uses: ./.github/actions/package-portable
        with:
          archive_name: symm-portable-linux-x64.zip
          release_semver: ${{ inputs.release_semver }}

      - name: 上传临时产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-linux-x64
          path: symm-portable-linux-x64.zip
          if-no-files-found: error

  build-linux-arm64:
    name: 构建产物 (linux-arm64)
    if: ${{ inputs.build_linux_arm64 }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: 打包便携 zip
        uses: ./.github/actions/package-portable
        with:
          archive_name: symm-portable-linux-arm64.zip
          release_semver: ${{ inputs.release_semver }}

      - name: 上传临时产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-linux-arm64
          path: symm-portable-linux-arm64.zip
          if-no-files-found: error

  build-macos-x64:
    name: 构建产物 (macos-x64)
    if: ${{ inputs.build_macos_x64 }}
    runs-on: macos-15-intel
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: 打包便携 zip
        uses: ./.github/actions/package-portable
        with:
          archive_name: symm-portable-macos-x64.zip
          release_semver: ${{ inputs.release_semver }}

      - name: 上传临时产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-macos-x64
          path: symm-portable-macos-x64.zip
          if-no-files-found: error

  build-macos-arm64:
    name: 构建产物 (macos-arm64)
    if: ${{ inputs.build_macos_arm64 }}
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: 打包便携 zip
        uses: ./.github/actions/package-portable
        with:
          archive_name: symm-portable-macos-arm64.zip
          release_semver: ${{ inputs.release_semver }}

      - name: 上传临时产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-macos-arm64
          path: symm-portable-macos-arm64.zip
          if-no-files-found: error
