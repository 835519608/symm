# 定时清理测试 Pre-release 和遗留测试 tag：全库只保留发布时间最新的一条 *-test* / test-run-* 测试包。
#
# 调度：每日北京时间 01:00（GitHub Actions cron 使用 UTC，即前一日 17:00 UTC）。
# 手动：gh workflow run cleanup-test-releases.yml
name: Cleanup Test Releases

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: 仅保留最新测试包
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 删除旧测试 Release
        uses: ./.github/actions/cleanup-test-releases
        with:
          github-token: ${{ github.token }}
