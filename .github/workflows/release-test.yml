# 测试包：Pre-release，不成为 Latest，不影响正式发布流程。
#
# 触发：
#   - 推送测试 tag（见下）或手动 workflow_dispatch（勾选目标包）
#
# Tag 命名：vX.Y.Z-test[-<platforms>]（test 后无数字；版本只在 X.Y.Z）
#   v0.1.0-test                 → 全平台全架构
#   v0.1.0-test-windows         → 仅 Windows 全架构
#   v0.1.0-test-linux           → 仅 Linux 全架构
#   v0.1.0-test-macos           → 仅 macOS 全架构
#   v0.1.0-test-windows-linux   → 多平台组合（别名 win / mac）
# 手动触发按目标包勾选；测试 tag 仍按平台全架构打包。
#
# 版本号：小改动 Z+1（0.1.0→0.1.1）；大变动 Y+1 且 Z 归零（0.1.2→0.2.0）
#
# 打包前不重复跑测试：校验当前 commit 上必需的检查已成功（见 verify-ci-passed）。
name: Release Test

on:
  push:
    tags:
      - "v*-test*"
  workflow_dispatch:
    inputs:
      build_windows_x64:
        description: 构建 Windows x64 包（含 installer）
        type: boolean
        default: true
      build_windows_arm64:
        description: 构建 Windows arm64 包
        type: boolean
        default: false
      build_windows_x86:
        description: 构建 Windows x86 包
        type: boolean
        default: false
      build_linux_x64:
        description: 构建 Linux x64 包
        type: boolean
        default: true
      build_linux_arm64:
        description: 构建 Linux arm64 包
        type: boolean
        default: false
      build_macos_x64:
        description: 构建 macOS x64 包
        type: boolean
        default: true
      build_macos_arm64:
        description: 构建 macOS arm64 包
        type: boolean
        default: false
      release_notes:
        description: 可选，覆盖 Release 正文（默认用 tag 指向 commit 的提交说明）
        type: string
        required: false
      release_semver:
        description: 手动 test-run-* 写入产物的 X.Y.Z
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: test-release-maintenance
  cancel-in-progress: false

jobs:
  plan:
    name: 解析目标包与 Release tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_semver: ${{ steps.version.outputs.semver }}
      release_body: ${{ steps.notes.outputs.body }}
      build_windows_x64: ${{ steps.meta.outputs.build_windows_x64 }}
      build_windows_arm64: ${{ steps.meta.outputs.build_windows_arm64 }}
      build_windows_x86: ${{ steps.meta.outputs.build_windows_x86 }}
      build_linux_x64: ${{ steps.meta.outputs.build_linux_x64 }}
      build_linux_arm64: ${{ steps.meta.outputs.build_linux_arm64 }}
      build_macos_x64: ${{ steps.meta.outputs.build_macos_x64 }}
      build_macos_arm64: ${{ steps.meta.outputs.build_macos_arm64 }}
      expected_assets: ${{ steps.meta.outputs.expected_assets }}
      expected_assets_with_checksums: ${{ steps.meta.outputs.expected_assets_with_checksums }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="test-run-${{ github.run_id }}"
          fi

          build_windows_x64=false
          build_windows_arm64=false
          build_windows_x86=false
          build_linux_x64=false
          build_linux_arm64=false
          build_macos_x64=false
          build_macos_arm64=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.build_windows_x64 }}" = "true" ] && build_windows_x64=true
            [ "${{ inputs.build_windows_arm64 }}" = "true" ] && build_windows_arm64=true
            [ "${{ inputs.build_windows_x86 }}" = "true" ] && build_windows_x86=true
            [ "${{ inputs.build_linux_x64 }}" = "true" ] && build_linux_x64=true
            [ "${{ inputs.build_linux_arm64 }}" = "true" ] && build_linux_arm64=true
            [ "${{ inputs.build_macos_x64 }}" = "true" ] && build_macos_x64=true
            [ "${{ inputs.build_macos_arm64 }}" = "true" ] && build_macos_arm64=true
          elif [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-test[0-9] ]]; then
            echo "::error::测试 tag 格式无效：${RELEASE_TAG}"
            echo "勿在 test 后加数字（如 v0.1.0-test15）；应使用 vX.Y.Z-test 或 vX.Y.Z-test-windows"
            exit 1
          elif [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-test$ ]]; then
            build_windows_x64=true
            build_windows_arm64=true
            build_windows_x86=true
            build_linux_x64=true
            build_linux_arm64=true
            build_macos_x64=true
            build_macos_arm64=true
          elif [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-test-(.+)$ ]]; then
            suffix="${BASH_REMATCH[1]}"
            IFS='-' read -ra parts <<< "${suffix}"
            for part in "${parts[@]}"; do
              case "${part}" in
                windows|win)
                  build_windows_x64=true
                  build_windows_arm64=true
                  build_windows_x86=true
                  ;;
                linux)
                  build_linux_x64=true
                  build_linux_arm64=true
                  ;;
                macos|mac)
                  build_macos_x64=true
                  build_macos_arm64=true
                  ;;
                *)
                  echo "::error::未知平台段「${part}」（tag: ${RELEASE_TAG}）。期望形如 v0.1.0-test-windows 或 v0.1.0-test-windows-linux"
                  exit 1
                  ;;
              esac
            done
            if ! $build_windows_x64 && ! $build_windows_arm64 && ! $build_windows_x86 && ! $build_linux_x64 && ! $build_linux_arm64 && ! $build_macos_x64 && ! $build_macos_arm64; then
              echo "::error::未识别任何平台（tag: ${RELEASE_TAG}）"
              exit 1
            fi
          elif [[ "${RELEASE_TAG}" =~ ^test-run- ]]; then
            build_windows_x64=true
            build_linux_x64=true
            build_macos_x64=true
          else
            echo "::error::测试 tag 格式无效：${RELEASE_TAG}"
            echo "期望：vX.Y.Z-test 或 vX.Y.Z-test-<platform(s)>（如 v0.1.1-test-windows）"
            exit 1
          fi

          if ! $build_windows_x64 && ! $build_windows_arm64 && ! $build_windows_x86 && ! $build_linux_x64 && ! $build_linux_arm64 && ! $build_macos_x64 && ! $build_macos_arm64; then
            echo "::error::至少选择一个目标包"
            exit 1
          fi

          expected_assets=()
          $build_windows_x64 && expected_assets+=("symm-setup-windows-x64.exe" "symm-portable-windows-x64.zip")
          $build_windows_arm64 && expected_assets+=("symm-portable-windows-arm64.zip")
          $build_windows_x86 && expected_assets+=("symm-portable-windows-x86.zip")
          $build_linux_x64 && expected_assets+=("symm-portable-linux-x64.zip")
          $build_linux_arm64 && expected_assets+=("symm-portable-linux-arm64.zip")
          $build_macos_x64 && expected_assets+=("symm-portable-macos-x64.zip")
          $build_macos_arm64 && expected_assets+=("symm-portable-macos-arm64.zip")

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "build_windows_x64=${build_windows_x64}"
            echo "build_windows_arm64=${build_windows_arm64}"
            echo "build_windows_x86=${build_windows_x86}"
            echo "build_linux_x64=${build_linux_x64}"
            echo "build_linux_arm64=${build_linux_arm64}"
            echo "build_macos_x64=${build_macos_x64}"
            echo "build_macos_arm64=${build_macos_arm64}"
            echo "expected_assets<<ASSETS_EOF"
            printf '%s\n' "${expected_assets[@]}"
            echo "ASSETS_EOF"
            echo "expected_assets_with_checksums<<ASSETS_WITH_CHECKSUMS_EOF"
            printf '%s\n' "${expected_assets[@]}"
            echo "SHA256SUMS"
            echo "ASSETS_WITH_CHECKSUMS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Release tag: ${RELEASE_TAG}"
          echo "Targets: windows-x64=${build_windows_x64} windows-arm64=${build_windows_arm64} windows-x86=${build_windows_x86} linux-x64=${build_linux_x64} linux-arm64=${build_linux_arm64} macos-x64=${build_macos_x64} macos-arm64=${build_macos_arm64}"

      - name: 校验当前 commit 的 CI 已通过
        uses: ./.github/actions/verify-ci-passed
      - name: 校验当前 commit 的 Workflow Lint 已通过
        uses: ./.github/actions/verify-ci-passed
        with:
          workflow_file: workflow-lint.yml

      - id: version
        uses: ./.github/actions/resolve-release-version
        with:
          release_tag: ${{ steps.meta.outputs.release_tag }}
          release_semver: ${{ github.event_name == 'workflow_dispatch' && inputs.release_semver || '' }}

      - id: notes
        uses: ./.github/actions/prepare-release-notes
        with:
          dispatch_notes: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}

  build_assets:
    name: 构建测试平台产物
    needs: plan
    uses: ./.github/workflows/build-release-assets.yml
    with:
      release_semver: ${{ needs.plan.outputs.release_semver }}
      artifact_prefix: release-test-assets
      build_windows_x64: ${{ needs.plan.outputs.build_windows_x64 == 'true' }}
      build_windows_arm64: ${{ needs.plan.outputs.build_windows_arm64 == 'true' }}
      build_windows_x86: ${{ needs.plan.outputs.build_windows_x86 == 'true' }}
      build_linux_x64: ${{ needs.plan.outputs.build_linux_x64 == 'true' }}
      build_linux_arm64: ${{ needs.plan.outputs.build_linux_arm64 == 'true' }}
      build_macos_x64: ${{ needs.plan.outputs.build_macos_x64 == 'true' }}
      build_macos_arm64: ${{ needs.plan.outputs.build_macos_arm64 == 'true' }}

  publish-test-release:
    name: 发布测试 Release
    needs:
      - plan
      - build_assets
    if: ${{ always() && needs.plan.result == 'success' && needs.build_assets.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载全部临时产物
        uses: actions/download-artifact@v8
        with:
          pattern: release-test-assets-*
          path: dist
          merge-multiple: true

      - name: 校验待发布产物
        uses: ./.github/actions/validate-release-assets
        with:
          expected_assets: ${{ needs.plan.outputs.expected_assets }}

      - name: 生成 SHA256SUMS
        uses: ./.github/actions/generate-sha256sums

      - name: 发布到 GitHub Release（测试）
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Test ${{ needs.plan.outputs.release_tag }}
          body: ${{ needs.plan.outputs.release_body }}
          files: dist/*
          prerelease: true
          make_latest: false
          generate_release_notes: false
          fail_on_unmatched_files: true

      - name: 清理旧测试 Release
        uses: ./.github/actions/cleanup-test-releases
        with:
          github-token: ${{ github.token }}
          keep-tag: ${{ needs.plan.outputs.release_tag }}

      - name: 校验已发布测试 Release
        uses: ./.github/actions/validate-release-assets
        with:
          expected_assets: ${{ needs.plan.outputs.expected_assets_with_checksums }}
          release_tag: ${{ needs.plan.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: "true"
