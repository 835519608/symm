name: Package Windows (installer + portable zip)
description: 从发版 tag 写入版本号，构建安装包 / zip / SHA256SUMS

inputs:
  release_version:
    description: 完整发布版本（如 0.2.7-test），用于 Release 资源路径
    required: true
  release_semver:
    description: Cargo / 安装包显示用 X.Y.Z
    required: true
  build_target:
    description: Rust target triple；留空表示使用 runner 原生 target
    required: false
    default: ""
  portable_name:
    description: 便携 zip 文件名
    required: false
    default: symm-portable-windows-x64.zip
  installer_name:
    description: 安装包文件名；仅 build_installer=true 时使用
    required: false
    default: symm-setup-windows-x64.exe
  checksum_name:
    description: checksum 文件名
    required: false
    default: SHA256SUMS
  build_installer:
    description: 是否构建 Inno Setup 安装包
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: 应用发版版本号
      uses: ./.github/actions/apply-cargo-version
      with:
        semver: ${{ inputs.release_semver }}

    - name: 安装 Inno Setup
      if: ${{ inputs.build_installer == 'true' }}
      shell: pwsh
      run: choco install innosetup -y --no-progress

    - name: 下载 GUI 内嵌字体
      uses: ./.github/actions/fetch-gui-font

    - name: 构建 release（CLI + GUI）
      shell: pwsh
      run: |
        $target = "${{ inputs.build_target }}"
        if ($target) {
          rustup target add $target
        }
        $args = @("build", "--release", "--features", "gui", "--bin", "symm", "--bin", "symm-cli")
        if ($target) {
          $args += @("--target", $target)
        }
        cargo @args

    - name: 编译便携安装包
      if: ${{ inputs.build_installer == 'true' }}
      shell: pwsh
      run: |
        $semver = "${{ inputs.release_semver }}"
        $target = "${{ inputs.build_target }}"
        $buildDir = if ($target) { "target\$target\release" } else { "target\release" }
        $outputBase = [System.IO.Path]::GetFileNameWithoutExtension("${{ inputs.installer_name }}")
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { throw "ISCC not found: $iscc" }
        & $iscc "/DAppVersion=$semver" "/DBuildDir=$buildDir" "/DMyOutputBase=$outputBase" "packaging\windows\symm-setup.iss"

    - name: 打包便携 zip
      shell: pwsh
      run: |
        $target = "${{ inputs.build_target }}"
        $buildDir = if ($target) { "target/$target/release" } else { "target/release" }
        $root = "packaging/windows/staging/symm"
        Remove-Item -Recurse -Force "packaging/windows/staging" -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path "$root/cli", "$root/data" | Out-Null
        Copy-Item "$buildDir/symm.exe" "$root/"
        Copy-Item "$buildDir/symm-cli.exe" "$root/cli/"
        if (Test-Path "${{ inputs.portable_name }}") { Remove-Item "${{ inputs.portable_name }}" }
        Compress-Archive -Path "packaging/windows/staging/symm" -DestinationPath "${{ inputs.portable_name }}"

    - name: 生成 SHA256SUMS
      shell: pwsh
      run: |
        $files = @("${{ inputs.portable_name }}")
        if ("${{ inputs.build_installer }}" -eq "true") {
          $files = @("packaging/windows/dist/${{ inputs.installer_name }}") + $files
        }
        $lines = foreach ($file in $files) {
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $file -Leaf)"
        }
        $lines | Set-Content -Path "${{ inputs.checksum_name }}" -Encoding ascii

    - name: 复制发布文件到工作区根目录
      if: ${{ inputs.build_installer == 'true' }}
      shell: pwsh
      run: |
        Copy-Item "packaging/windows/dist/${{ inputs.installer_name }}" "${{ inputs.installer_name }}"
