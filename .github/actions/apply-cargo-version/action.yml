name: Apply Cargo version
description: 将 Cargo.toml 的 version 设为发版 semver（仅 CI 工作区，不提交）

inputs:
  semver:
    description: X.Y.Z
    required: true

runs:
  using: composite
  steps:
    - name: 写入 Cargo.toml version
      shell: bash
      run: |
        set -euo pipefail
        perl -i -pe 's/^version = .*/version = "${{ inputs.semver }}"/' Cargo.toml
        SEMVER="${{ inputs.semver }}" perl -0pi -e 's/(\[\[package\]\]\r?\nname = "symm"\r?\nversion = ")[^"]+(")/$1$ENV{SEMVER}$2/' Cargo.lock

        cargo_toml_version="$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)"
        cargo_lock_version="$(
          perl -0ne 'print $1 if /\[\[package\]\]\r?\nname = "symm"\r?\nversion = "([^"]+)"/' Cargo.lock
        )"

        test "$cargo_toml_version" = "${{ inputs.semver }}"
        test "$cargo_lock_version" = "${{ inputs.semver }}"
        printf 'Cargo.toml version = %s\n' "$cargo_toml_version"
        printf 'Cargo.lock version = %s\n' "$cargo_lock_version"
