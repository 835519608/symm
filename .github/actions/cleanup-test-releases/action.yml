name: Cleanup test releases
description: Keep one test pre-release and delete older test releases/tags.

inputs:
  github-token:
    description: Token with contents:write permission.
    required: true
  keep-tag:
    description: Optional test release tag to keep. Defaults to the newest test pre-release by publishedAt.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cleanup test releases
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        KEEP_TAG: ${{ inputs.keep-tag }}
      run: |
        set -euo pipefail

        selector='
          [.[] | select(.isPrerelease) | select(.tagName | test("-test|^test-run-"))]
        '

        if [ -n "${KEEP_TAG}" ]; then
          if ! keep_json="$(gh release view "${KEEP_TAG}" --json tagName,isPrerelease)"; then
            echo "::error::指定保留的测试 Release 不存在或不是 Pre-release：${KEEP_TAG}"
            exit 1
          fi
          keep_tag_name="$(jq -r '.tagName' <<< "${keep_json}")"
          keep_is_prerelease="$(jq -r '.isPrerelease' <<< "${keep_json}")"
          if [ "${keep_is_prerelease}" != "true" ] || ! [[ "${keep_tag_name}" =~ -test|^test-run- ]]; then
            echo "::error::指定保留的测试 Release 不存在或不是 Pre-release：${KEEP_TAG}"
            exit 1
          fi
          keep_tag="${keep_tag_name}"
          echo "保留本次测试包：${keep_tag}"
        else
          keep_tag="$(gh release list --limit 200 --json tagName,isPrerelease,publishedAt \
            --jq "${selector} | sort_by(.publishedAt) | reverse | .[0].tagName // empty")"
          if [ -z "${keep_tag}" ]; then
            echo "无测试 Pre-release，将清理所有遗留测试 tag"
          else
            echo "保留最新测试包：${keep_tag}"
          fi
        fi

        mapfile -t to_delete < <(
          gh release list --limit 200 --json tagName,isPrerelease,publishedAt \
            --jq "${selector} | sort_by(.publishedAt) | reverse | .[] | select(.tagName != \"${keep_tag}\") | .tagName"
        )

        if [ "${#to_delete[@]}" -eq 0 ]; then
          echo "没有需要删除的旧测试包"
        else
          for tag in "${to_delete[@]}"; do
            echo "删除旧测试包：${tag}"
            gh release delete "${tag}" --yes --cleanup-tag
          done
        fi

        mapfile -t stale_tags < <(
          gh api "repos/${GH_REPO}/git/matching-refs/tags" --paginate \
            --jq '.[]?.ref | sub("^refs/tags/"; "") | select(test("-test|^test-run-"))' \
            | sort -u
        )

        for tag in "${stale_tags[@]}"; do
          if [ -n "${keep_tag}" ] && [ "${tag}" = "${keep_tag}" ]; then
            echo "保留测试 tag：${tag}"
            continue
          fi

          echo "删除旧测试 tag：${tag}"
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${tag}" >/dev/null
        done
