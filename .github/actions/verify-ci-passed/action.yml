name: Verify CI passed
description: 校验当前 commit 上 CI 工作流已成功完成（不重复跑测试）

inputs:
  workflow_file:
    description: CI workflow 文件名（位于 .github/workflows/）
    required: false
    default: ci.yml
  sha:
    description: 要校验的 commit SHA
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: 校验 CI 已通过
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW_FILE: ${{ inputs.workflow_file }}
        INPUT_SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail

        SHA="${INPUT_SHA:-${GITHUB_SHA}}"
        REPO="${GITHUB_REPOSITORY}"
        DEFAULT_BRANCH="$(gh api "/repos/${REPO}" --jq '.default_branch')"

        echo "检查默认分支 ${DEFAULT_BRANCH} 上 commit ${SHA} 的 CI（${WORKFLOW_FILE}）…"

        git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
        if ! git merge-base --is-ancestor "${SHA}" "origin/${DEFAULT_BRANCH}"; then
          echo "::error::commit ${SHA} 不在默认分支 ${DEFAULT_BRANCH} 上，不能发布。"
          echo "::error::请先合并到默认分支并等待默认分支 push CI 通过。"
          exit 1
        fi

        runs_json=$(gh api \
          -H "Accept: application/vnd.github+json" \
          "/repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?branch=${DEFAULT_BRANCH}&event=push&head_sha=${SHA}&per_page=20")

        latest=$(echo "$runs_json" | jq -r '
          [.workflow_runs[]]
          | sort_by(.updated_at) | reverse | .[0] // empty
        ')

        if [ -z "${latest}" ] || [ "${latest}" = "null" ]; then
          echo "::error::commit ${SHA} 上未找到默认分支 push 触发的 ${WORKFLOW_FILE} 运行记录。"
          echo "::error::请先 push 到默认分支，待必需 Actions 全部通过后再打 tag 或手动触发打包。"
          exit 1
        fi

        status=$(echo "$latest" | jq -r '.status')
        conclusion=$(echo "$latest" | jq -r '.conclusion // ""')
        url=$(echo "$latest" | jq -r '.html_url')

        if [ "${status}" = "completed" ] && [ "${conclusion}" = "success" ]; then
          echo "CI 已通过: ${url}"
          exit 0
        fi

        if [ "${status}" = "queued" ] || [ "${status}" = "in_progress" ] || [ "${status}" = "waiting" ]; then
          echo "::error::commit ${SHA} 的 CI 仍在运行，请等待通过后再打包。"
          echo "运行中: ${url}"
          exit 1
        fi

        echo "::error::commit ${SHA} 的最新 CI 未通过（status=${status}, conclusion=${conclusion}），已中止打包。"
        echo "最近运行: ${url}"
        exit 1
